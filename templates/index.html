<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudPulse | Monitoring</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial,sans-serif;background:#0b1020;color:#eaf0ff}body{max-width:1100px;margin:0 auto;padding:36px 22px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:2rem;margin:0}p{color:#99a9c9}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#42d6a4;margin-right:8px}.panel{background:#141c30;border:1px solid #26334f;border-radius:16px;padding:22px;margin:20px 0}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:13px 10px;border-bottom:1px solid #26334f;font-size:14px}th{color:#9baaca}.good{color:#42d6a4;font-weight:700}.bad{color:#ff7184;font-weight:700}.metric{font-size:28px;font-weight:800}small{color:#9baaca}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.empty{padding:25px;color:#9baaca}button{background:#4565ef;color:white;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}canvas{width:100%;height:190px}
</style></head><body><header><div><h1><span class="dot"></span>CloudPulse</h1><p>Website health & incident monitoring</p></div><button onclick="load()">Refresh</button></header>
<div id="cards"></div><section class="panel"><h2>Response time trend</h2><canvas id="chart" width="1000" height="190"></canvas></section>
<section class="panel"><h2>Latest checks</h2><div style="overflow:auto"><table><thead><tr><th>Website</th><th>Status</th><th>HTTP</th><th>Latency</th><th>Checked (UTC)</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel"><h2>Recent incidents</h2><div id="incidents" class="empty">No incidents recorded.</div></section><small>Auto-refreshes every 15 seconds. Checks run at the configured interval.</small>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/status');if(!r.ok)throw Error('API unavailable');const d=await r.json();let healthy=d.latest.filter(x=>x.healthy).length;document.getElementById('cards').innerHTML=[['Monitored sites',d.latest.length],['Healthy',healthy],['Down / failing',d.latest.length-healthy],['Total checks',d.history.length+' recent']].map(([a,b])=>`<div class="panel"><small>${a}</small><div class="metric">${b}</div></div>`).join('');document.getElementById('rows').innerHTML=d.latest.map(x=>`<tr><td>${esc(x.url)}</td><td class="${x.healthy?'good':'bad'}">${x.healthy?'Healthy':'Alert'}</td><td>${x.status_code??'-'}</td><td>${x.response_ms} ms</td><td>${esc(x.checked_at.slice(0,19))}</td></tr>`).join('')||'<tr><td colspan="5">Waiting for first checks...</td></tr>';let incidents=d.history.filter(x=>!x.healthy).slice(0,8);document.getElementById('incidents').innerHTML=incidents.map(x=>`<p><span class="bad">ALERT</span> ${esc(x.url)} — ${esc(x.error||'HTTP '+x.status_code)} (${esc(x.checked_at.slice(0,19))} UTC)</p>`).join('')||'No incidents recorded.';draw(d.history.slice(0,35).reverse());}catch(e){document.getElementById('incidents').textContent='Unable to load monitoring data: '+e.message}}
function draw(rows){const c=document.getElementById('chart'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.strokeStyle='#334563';g.beginPath();g.moveTo(30,15);g.lineTo(30,165);g.lineTo(985,165);g.stroke();if(!rows.length)return;let max=Math.max(100,...rows.map(r=>r.response_ms||0));g.strokeStyle='#6f9dff';g.lineWidth=3;g.beginPath();rows.forEach((r,i)=>{let x=35+i*940/Math.max(1,rows.length-1),y=160-(r.response_ms||0)/max*140;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#9baaca';g.font='13px sans-serif';g.fillText(max.toFixed(0)+' ms',35,20);g.fillText('0 ms',35,182)}
load();setInterval(load,15000);
</script></body></html>
